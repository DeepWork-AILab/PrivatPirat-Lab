        {label:'App Store · Global', sub:'Happ - Proxy Utility', url:'https://apps.apple.com/us/app/happ-proxy-utility/id6504287215'},
        {label:'App Store · Россия', sub:'Happ Lite', url:'https://apps.apple.com/ru/app/happ-lite/id6799917773'}
      ]
    },
    windows: {
      title: 'Windows',
      items: [
        {label:'Windows x64', sub:'Для большинства ПК', url:'https://files-hub.com/download/windows/latest?arch=x64'},
        {label:'Windows ARM64', sub:'Для ARM-устройств', url:'https://files-hub.com/download/windows/latest?arch=arm64'}
      ]
    },
    macos: {
      title: 'macOS',
      items: [
        {label:'App Store', sub:'iPhone, iPad и Mac', url:'https://apps.apple.com/us/app/happ-proxy-utility/id6504287215'},
        {label:'Universal DMG', sub:'Intel + Apple Silicon', url:'https://files-hub.com/download/macos/latest?arch=universal'}
      ]
    },
    linux: {
      title: 'Linux',
      items: [
        {label:'DEB x64', sub:'Debian / Ubuntu · x64', url:'https://files-hub.com/download/linux/latest?arch=x64&package=deb'},
        {label:'DEB ARM64', sub:'Debian / Ubuntu · ARM64', url:'https://files-hub.com/download/linux/latest?arch=arm64&package=deb'},
        {label:'RPM x64', sub:'Fedora / RHEL · x64', url:'https://files-hub.com/download/linux/latest?arch=x64&package=rpm'},
        {label:'RPM ARM64', sub:'Fedora / RHEL · ARM64', url:'https://files-hub.com/download/linux/latest?arch=arm64&package=rpm'},
        {label:'Arch x64', sub:'Arch Linux · x64', url:'https://files-hub.com/download/linux/latest?arch=x64&package=pkg'},
        {label:'Arch ARM64', sub:'Arch Linux · ARM64', url:'https://files-hub.com/download/linux/latest?arch=arm64&package=pkg'}
      ]
    },
    other: {
      title: 'Другие платформы',
      items: [
        {label:'Android TV · Google Play', sub:'Happ для Android / Android TV', url:'https://play.google.com/store/apps/details?id=com.happproxy'},
        {label:'Android TV · APK', sub:'Прямая загрузка', url:'https://files-hub.com/download/android/latest?arch=universal'},
        {label:'Apple TV', sub:'Happ - Proxy Utility for TV', url:'https://apps.apple.com/us/app/happ-proxy-utility-for-tv/id6748297274'}
      ]
    }
  };

  const modal = document.getElementById('modal');
  const title = document.getElementById('sheetTitle');
  const choices = document.getElementById('choices');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function openPlatform(key){
    const group = LINKS[key];
    if(!group) return;
    title.textContent = group.title;
    choices.innerHTML = '';
    group.items.forEach(item => {
      const a = document.createElement('a');
      a.className = 'choice';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      const text = document.createElement('span');
      text.innerHTML = `<span class="cmain"></span><small></small>`;
      text.querySelector('.cmain').textContent = item.label;
      text.querySelector('small').textContent = item.sub;
      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '›';
      a.append(text, chev);
      choices.appendChild(a);
    });
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  function validSub(){
    return /^https:\/\//i.test(SUBSCRIPTION_URL) && !SUBSCRIPTION_URL.includes('__SUBSCRIPTION_URL__');
  }

  document.querySelectorAll('[data-platform]').forEach(btn => btn.addEventListener('click', () => openPlatform(btn.dataset.platform)));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

  document.getElementById('openHapp').addEventListener('click', () => {
    if(!validSub()) { showToast('Подписка lilfox-am будет привязана после завершения развёртывания сервера.'); return; }
    window.location.href = 'happ://add/' + SUBSCRIPTION_URL;
  });

  document.getElementById('copySub').addEventListener('click', async () => {
    if(!validSub()) { showToast('Подписка lilfox-am пока не привязана.'); return; }
    try {
      await navigator.clipboard.writeText(SUBSCRIPTION_URL);
      showToast('Ссылка подписки скопирована');
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = SUBSCRIPTION_URL; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      showToast(ok ? 'Ссылка подписки скопирована' : 'Не удалось скопировать ссылку');
    }
  });
})();
</script>
</body>
</html>
